<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Control - Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-96 border border-slate-700">
        <div class="text-center mb-6">
            <div class="flex justify-center mb-3">
                <span class="text-3xl">🛡</span>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">Centro de Control</h1>
            <p class="text-slate-400 text-sm">Ingrese sus credenciales de Administrador</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500 text-red-400 text-sm p-3 rounded-xl mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login_admin" method="POST" class="space-y-4">
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1">Usuario Administrador</label>
                <input type="text" name="usuario" required 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1">Contraseña</label>
                <div class="relative">
                    <input type="password" name="codigo_admin" id="password" required 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 pr-12 text-white focus:outline-none focus:border-cyan-500">
                    <button type="button" onclick="togglePassword()" 
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white focus:outline-none">
                        <svg id="icono-ojo" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-cyan-600/35">
                Ingresar al Mapa en Vivo
            </button>
        </form>

        <!-- Enlace a Términos y Condiciones Institucionales -->
        <div class="mt-6 text-center border-t border-slate-700/60 pt-4">
            <p class="text-xs text-slate-400">
                El acceso a este sistema de monitoreo está sujeto a las políticas de seguridad y <br>
                <a href="/terminos" target="_blank" class="text-cyan-400 hover:underline font-medium">Términos de Uso Institucional</a>.
            </p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icono = document.getElementById('icono-ojo');
            if (input.type === 'password') {
                input.type = 'text';
                icono.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />`;
            } else {
                input.type = 'password';
                icono.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            }
        }
    </script>
</body>
</html>
